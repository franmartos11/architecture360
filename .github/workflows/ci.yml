name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm exec tsc --noEmit

      - run: pnpm test

      # El build atrapa lo que lint, tsc y los tests no ven: imports que
      # solo fallan al empaquetar (server-only en el bundle del cliente),
      # páginas que rompen al prerenderizar. No necesita variables de
      # entorno: las rutas que leen Supabase son dinámicas.
      - run: pnpm build
